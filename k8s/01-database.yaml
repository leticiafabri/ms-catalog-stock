apiVersion: v1
kind: Secret
metadata:
  name: ms-catalog-db
type: Opaque
stringData:
  POSTGRES_DB: catalog_db
  POSTGRES_USER: catalog
  POSTGRES_PASSWORD: replace-this-for-your-environment
  DATABASE_URL: postgresql+psycopg://catalog:replace-this-for-your-environment@ms-catalog-db-service:5432/catalog_db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ms-catalog-db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-catalog-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-catalog-db
  template:
    metadata:
      labels:
        app: ms-catalog-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: ms-catalog-db
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ms-catalog-db
---
apiVersion: v1
kind: Service
metadata:
  name: ms-catalog-db-service
spec:
  type: ClusterIP
  selector:
    app: ms-catalog-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
