apiVersion: v1
kind: Secret
metadata:
  name: ms-catalog-runtime
type: Opaque
stringData:
  RABBITMQ_URL: amqp://catalog:replace-this-for-your-environment@rabbitmq:5672/
  RABBITMQ_EXCHANGE: app.events
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-catalog-stock
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ms-catalog-stock
  template:
    metadata:
      labels:
        app: ms-catalog-stock
    spec:
      containers:
        - name: app
          image: your-dockerhub-user/ms-catalog-stock:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: ms-catalog-db
            - secretRef:
                name: ms-catalog-runtime
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ms-catalog-service
spec:
  type: ClusterIP
  selector:
    app: ms-catalog-stock
  ports:
    - name: http
      port: 8080
      targetPort: http
