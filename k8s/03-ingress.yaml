apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-catalog-stock
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/catalog
            pathType: Prefix
            backend:
              service:
                name: ms-catalog-service
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: ms-catalog-service
                port:
                  number: 8080
